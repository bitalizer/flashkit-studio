[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashkit-studio"
version = "1.0.0"
description = "Desktop SWF inspector built on flashkit — class browser, AS3 decompiler view, references, hierarchy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "bitalizer"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyflashkit>=1.3.0",
    "PySide6>=6.5",
]

[project.urls]
Homepage = "https://github.com/bitalizer/flashkit-studio"
Repository = "https://github.com/bitalizer/flashkit-studio"
Issues = "https://github.com/bitalizer/flashkit-studio/issues"

[project.scripts]
flashkit-studio = "flashkit_studio.app:run"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["flashkit_studio*"]

[tool.setuptools.package-data]
flashkit_studio = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]
